# codemagic.yaml - CI/CD configuration for VitaSync (native Android, Kotlin + Compose).
# Reference: https://docs.codemagic.io/yaml-quick-start/building-a-native-android-app/
#
# This file must sit in the ROOT of the repository, next to settings.gradle.kts.
#
# Two workflows are defined:
#   android-debug    -> an installable debug APK. Needs no secrets, so it works
#                       as soon as you push this file.
#   android-release  -> a signed .aab + .apk for Play. Needs an Android keystore
#                       uploaded to Codemagic (Team settings > Code signing
#                       identities > Android keystores) using the reference name
#                       below.

workflows:
  android-debug:
    name: VitaSync - debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.vitasync.app"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Make Gradle wrapper executable
        script: |
          chmod +x ./gradlew
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - you@example.com   # <-- replace with your email address
        notify:
          success: true
          failure: true

  android-release:
    name: VitaSync - signed release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      # The name you gave the keystore when uploading it to Codemagic.
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "com.vitasync.app"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Make Gradle wrapper executable
        script: |
          chmod +x ./gradlew
      - name: Build release bundle and APK
        script: |
          # BUILD_NUMBER is a Codemagic built-in that increments per build; it is
          # passed to Gradle via -P and read in app/build.gradle.kts.
          ./gradlew bundleRelease assembleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER \
            --stacktrace
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - you@example.com   # <-- replace with your email address
        notify:
          success: true
          failure: true
